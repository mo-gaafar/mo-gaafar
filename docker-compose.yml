# Docker Compose for Coolify — app only.
#
# Postgres is provisioned SEPARATELY as a Coolify PostgreSQL database resource
# (Coolify runs it from the official postgres image and manages backups/volume).
# This compose deploys just the app and connects to that database via
# DATABASE_URL.
#
# In Coolify:
#   1. Create a "PostgreSQL" database resource. Copy its connection string.
#   2. Create a "Docker Compose" resource pointing at this file.
#   3. Set env vars in the Coolify UI: DATABASE_URL (from step 1), PAYLOAD_SECRET,
#      NEXT_PUBLIC_SERVER_URL, the S3_* (R2) vars, and optionally SEED_ADMIN_*.
#
# For a self-contained LOCAL run with a bundled Postgres, use
# docker-compose.local.yml instead.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Point at the Coolify-managed PostgreSQL resource. Use its INTERNAL
      # hostname (same Docker network). Add ?sslmode=require if the DB enforces TLS.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the Coolify Postgres connection string}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set a strong PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      NODE_ENV: production
      # First-run admin (used only by `pnpm seed`).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # Media storage on Cloudflare R2 (required in prod — see docs/09-cloudflare.md).
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    # Expose the container port to Coolify's reverse proxy (Traefik) instead of
    # publishing it to a host port. Publishing 3000:3000 collides on shared hosts
    # ("port is already allocated"); Coolify routes to the container via the FQDN
    # and the app's configured "Ports Exposes" (3000) over the internal network.
    expose:
      - '3000'
