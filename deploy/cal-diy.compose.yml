# Cal.diy v6.2.0's official release pipeline publishes under the legacy image name.
services:
  cal:
    image: calcom/cal.com:v6.2.0@sha256:ace3bb1219fb7306585ab9f4d94d41af7ee064c343db0498173436bbe857bd49
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_WEBAPP_URL: https://cal.botica.it.com
      NEXTAUTH_URL: https://cal.botica.it.com/api/auth
      DATABASE_HOST: database:5432
      DATABASE_URL: postgresql://cal:${SERVICE_PASSWORD_DATABASE}@database:5432/cal
      DATABASE_DIRECT_URL: postgresql://cal:${SERVICE_PASSWORD_DATABASE}@database:5432/cal
      NEXTAUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      CALENDSO_ENCRYPTION_KEY: ${SERVICE_PASSWORD_32_ENCRYPTION}
      CALCOM_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_DISABLE_SIGNUP: 'true'
      GOOGLE_LOGIN_ENABLED: 'false'
      GOOGLE_API_CREDENTIALS: ${GOOGLE_API_CREDENTIALS:-}
      EMAIL_FROM: ${EMAIL_FROM:-mohamed_gaafar@ieee.org}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER:-}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/auth/login']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cal
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_DATABASE}
      POSTGRES_DB: cal
    volumes:
      - cal-database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cal -d cal']
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  cal-database:
